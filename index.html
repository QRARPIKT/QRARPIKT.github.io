<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qラピカ</title>
<link rel="stylesheet" href="assets/style.css?v=20260830-7">
<style>
body{min-height:100vh;display:flex;align-items:center;justify-content:center}
.gate{text-align:center;padding:2rem 1.2rem;animation:gateIn .8s ease}
.gate-pen{font-size:2.2rem;letter-spacing:.5em;margin-right:-.5em}
.gate-sub{font-size:.78rem;color:var(--ink-soft);letter-spacing:.4em;margin-right:-.4em;margin-top:.8rem}
.gate-rule{width:3em;height:1px;background:var(--line);margin:1.8rem auto}
.gate-entry{position:relative;font-size:.85rem;padding-bottom:.3rem}
.gate-entry::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-soft));transition:width .5s ease}
.gate-entry:hover{text-decoration:none}
.gate-entry:hover::after{width:100%}
@keyframes gateIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<main class="gate">
  <div class="gate-pen">Qラピカ</div>
  <div class="gate-sub">本格推理文库</div>
  <div class="gate-rule"></div>
  <a class="gate-entry" href="bunko/index.html">进入文库 →</a>
</main>
</body>
</html>
