    <h1>吴哥雕像时代线</h1>
    <p>在吴哥国家博物馆，砂岩、木与金属并不沉默：梵天、毗湿奴与湿婆从印度教宇宙里走来，佛陀在蛇冠、足迹与卧姿中反复现身。从真腊到吴哥，再到后吴哥，风格在换，信仰在转手，而每一件残缺都还在讲秩序、慈悲与时间。</p>
    <div class="rule"></div>
  </section>
