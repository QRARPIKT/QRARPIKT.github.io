    <h1>住在暹粒</h1>
    <div class="meta">柬埔寨 · 暹粒 · 住宿</div>
  </div>

  <p>在暹粒的几天都住在柏悦。这家酒店连续两年拿到米其林指南的「一星钥」——这是米其林给酒店评的等级，不在餐厅那套星星里。酒店中庭有一方水池，池中央立着一棵老榕树；每天早餐的时候，池边会围起一圈当地集市，也有人坐在那里弹奏高棉音乐。酒店和当地的样子长在一起，这是我喜欢柏悦的地方。</p>
  <div class="food-grid">
    <figure><img src="assets/food/01.jpg" alt="欢迎酒"><figcaption>入住的欢迎酒</figcaption></figure>
    <figure><img src="assets/food/02.jpg" alt="房间小零食"><figcaption>房间里送的小零食</figcaption></figure>
    <figure><img src="assets/food/03.jpg" alt="中庭水池"><figcaption>夜晚的中庭，水池和老榕树</figcaption></figure>
    <figure><img src="assets/food/04.jpg" alt="柏悦早餐"><figcaption>每天必点的椰子，椰盖上烙着酒店的名字</figcaption></figure>
    <figure><img src="assets/food/05.jpg" alt="虾蛋饼"><figcaption>虾蛋饼，早餐最爱</figcaption></figure>
    <figure><img src="assets/food/06.jpg" alt="银针粉"><figcaption>银针粉</figcaption></figure>
  </div>
  <p>早餐选择很丰富，可以单点，服务生里有中文说得很好的。高棉咖啡味道独特，做成拿铁尤其好喝。每天早餐也一定要吃高棉本地的菜，最爱虾蛋饼和银针粉。酒店的晚餐同样主打高棉菜，菜单会介绍柬埔寨每个省份的代表菜和它的特点——优雅，又很有当地特色，鸡尾酒也好喝。</p>
  <div class="food-grid">
    <figure><img src="assets/food/07.jpg" alt="柏悦晚餐"><figcaption>晚餐：牛肉咖喱、罗勒烤春鸡，前菜蟹肉饼</figcaption></figure>
    <figure><img src="assets/food/08.jpg" alt="吴哥风格杯子"><figcaption>鸡尾酒装在一个很有吴哥风格的杯子里</figcaption></figure>
