  <div class="work-head">
    <h1>巴方寺</h1>
    <div class="meta">吴哥 · 通王城</div>
  </div>

  <p>从巴戎寺往外走一段就是巴方寺。雨季，引道上湿漉漉的，有几只猴子也在散步。</p>

  <figure>
    <img src="assets/baphuon/01.jpg" alt="巴方寺引道与猴子">
    <figcaption>引道尽头就是巴方寺，两只猴子不慌不忙地走在石板路上</figcaption>
  </figure>

  <p>方方的寺庙。</p>

  <figure>
    <img src="assets/baphuon/02.jpg" alt="巴方寺侧面">
    <figcaption>侧面看过去，确实方方正正，一层一层叠上去</figcaption>
  </figure>

  <p>从巴方寺往空中宫殿走，陈老师带我们抄了一条小路。一路都是吴哥的绿意：古迹、断壁残垣和丛林长在一起，石头上覆满青苔。路上会看到很多散落的大石块——那些是还没修复完成的部分，就先放在原地，等着哪天被拼回去。</p>

  <figure>
    <img src="assets/baphuon/03.jpg" alt="通往空中宫殿的丛林小路">
    <figcaption>小路上散落的大石块覆满青苔，树从石堆里横着长出来</figcaption>
  </figure>
