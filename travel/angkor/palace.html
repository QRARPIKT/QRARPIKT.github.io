  <div class="work-head">
    <h1>古皇宫</h1>
    <div class="meta">吴哥 · 通王城</div>
  </div>

  <p>穿过巴方寺之后看到的古迹。这里好像大部分都还在修复，游客很少。</p>

  <figure>
    <img src="assets/palace/01.jpg" alt="空中宫殿">
    <figcaption>空中宫殿——石阶陡得笔直，两侧蹲着石狮，左侧还搭着修复的脚手架</figcaption>
  </figure>

  <p>这是空中宫殿。有传说宫殿顶上住着蛇精，国王每天夜里都要上去与她相会，国家才能平安；若是有一天不去，国家就会降下灾祸。</p>

  <p>石阶下还有些当地人的供奉。</p>

  <figure>
    <img src="assets/palace/02.jpg" alt="石阶下的供奉">
    <figcaption>石狮前新供的鲜花、香烛与供品——传说归传说，这里至今仍是活的庙宇</figcaption>
  </figure>

  <p>墙上的碑文。</p>

  <figure>
    <img src="assets/palace/03.jpg" alt="墙上的碑文">
    <figcaption>门柱上的碑文，字迹密密麻麻地留到了今天</figcaption>
  </figure>

  <p>这里古时候是池塘。</p>

  <figure>
    <img src="assets/palace/04.jpg" alt="古池塘">
    <figcaption>如今水干了，只剩一圈石墙围着草地</figcaption>
  </figure>

  <figure>
    <img src="assets/palace/05.jpg" alt="东塔门">
    <figcaption>东塔门</figcaption>
  </figure>
