  <div class="work-head">
    <h1>变相寺</h1>
    <div class="meta">吴哥 · 大圈</div>
  </div>

  <p>很不一样的红砖金字塔风格。这里是皇家的火葬场。</p>

  <figure>
    <img src="assets/pre-rup/01.jpg" alt="变相寺全景">
    <figcaption>三层台基叠成金字塔，五座红砖塔立在顶上——和砂石砌的庙宇完全是两种气色</figcaption>
  </figure>

  <p>变相寺建于十世纪中叶，是罗贞陀罗跋摩二世的国庙，比吴哥寺早了一百多年。红砖砌塔、红土垒基，门饰与窗框才用砂岩——远远看去，整座庙是一种烧过的颜色。「变相」这个名字正合它的用途：皇家在这里举行火葬，肉身在此化作另一种存在。</p>

  <figure>
    <img src="assets/pre-rup/02.jpg" alt="变相寺砖塔与石狮">
    <figcaption>红砖塔身上已经爬了草，石狮还守着台阶</figcaption>
  </figure>

  <figure>
    <img src="assets/pre-rup/03.jpg" alt="中央塔门饰">
    <figcaption>中央塔的门饰，隔了千年仍然非常漂亮</figcaption>
  </figure>

  <figure>
    <img src="assets/pre-rup/04.jpg" alt="塔周女神浮雕">
    <figcaption>塔周的浮雕：砖龛里的神像，衣纹和璎珞的刻痕都还清楚</figcaption>
  </figure>

  <figure>
    <img src="assets/pre-rup/05.jpg" alt="从塔顶俯瞰">
    <figcaption>很高，也是看日落的好去处</figcaption>
  </figure>
