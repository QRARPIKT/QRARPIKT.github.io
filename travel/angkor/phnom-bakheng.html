  <div class="work-head">
    <h1>巴肯山</h1>
    <div class="meta">吴哥 · 小圈</div>
  </div>

  <p>九世纪末，耶输跋摩一世把都城从罗洛士迁到巴肯山一带，山上的巴肯寺是他建的第一座国庙，也是「庙山」形制的起点。如今山还是那座山，庙多半成了残迹，人们傍晚上山，主要是为了看日落——山顶限流，一次只放三百人。</p>

  <figure>
    <img src="assets/phnom-bakheng/01.jpg" alt="巴肯山日落">
    <figcaption>西边的太阳落向平原，整个天空烧成金色</figcaption>
  </figure>

  <figure>
    <img src="assets/phnom-bakheng/02.jpg" alt="看日落的人群">
    <figcaption>看日落的人。日落的观看席，一千年前就订好了</figcaption>
  </figure>

  <figure>
    <img src="assets/phnom-bakheng/03.jpg" alt="暮色中的平原">
    <figcaption>暮色降下来，远处发亮的一线是洞里萨湖</figcaption>
  </figure>

  <figure>
    <img src="assets/phnom-bakheng/04.jpg" alt="庙内佛像与晚霞">
    <figcaption>庙里的佛像还披着袈裟。晚霞从窗口进来，正好落在神龛上</figcaption>
  </figure>
