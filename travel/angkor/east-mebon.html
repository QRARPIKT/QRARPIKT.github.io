  <div class="work-head">
    <h1>东梅蓬</h1>
    <div class="meta">吴哥 · 大圈</div>
  </div>

  <p>东梅蓬建于九五二年，是罗贞陀罗跋摩二世的庙山，主供湿婆，也祭祀先王。它原本立在东巴莱湖中央的小岛上，当年要划船才能抵达——如今湖水早已干涸，塔山站在一片干地上。</p>
  <p>它看起来很像变相寺，这不是错觉：两座庙几乎共用同一张图纸——三层台基、五座砖塔、转角立象——东梅蓬还早建九年。</p>

  <figure>
    <img src="assets/east-mebon/01.jpg" alt="转角大象">
    <figcaption>台基转角的大象，原件，九百多年了</figcaption>
  </figure>

  <figure>
