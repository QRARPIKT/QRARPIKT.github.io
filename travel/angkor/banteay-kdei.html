    <h1>班迭哥迪寺</h1>
    <div class="meta">吴哥 · 大圈</div>
  </div>

  <p>班迭哥迪寺在皇家浴池正对面，十二世纪末由阇耶跋摩七世所建，与塔普伦寺同一时代、同一种佛教风格，名字大意是「僧房的城堡」。不知是不是名气的关系，游人到了这里忽然变少，寺里很安静。</p>

  <figure>
    <img src="assets/banteay-kdei/01.jpg" alt="人面塔门">

  </figure>

  <figure>
    <img src="assets/banteay-kdei/02.jpg" alt="佛陀像">

  </figure>

  <figure>

  </figure>

  <figure>
