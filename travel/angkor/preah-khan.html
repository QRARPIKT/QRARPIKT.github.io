  <div class="work-head">
    <h1>圣剑寺</h1>
    <div class="meta">吴哥 · 大圈</div>
  </div>

  <p>圣剑寺建于十二世纪末（一一九一年），是阇耶跋摩七世为父亲修建的「父庙」——正如塔普伦寺是他为母亲修建的「母庙」。它不只是一座庙：当年这里是一座城的中心，也是一所研修的大学，常住僧侣上千人。寺名来自传说中专属于国王的那柄圣剑。</p>

  <figure>
    <img src="assets/preah-khan/01.jpg" alt="门神">
    <figcaption>塔门旁的门神，按剑而立</figcaption>
  </figure>

  <figure>
    <img src="assets/preah-khan/02.jpg" alt="中央佛塔">
    <figcaption>全寺正中，一座钟形佛塔，烛光从顶上漏下来，像一支蜡烛。这是十六世纪添建的，塔身石壁上的小孔，原本用来固定包在外面的铜皮</figcaption>
  </figure>

  <p>在这里我们碰到了一个很热心的柬埔寨警卫。他主动告诉我们该从哪些角度拍，给我们拍合照，还领我们去一些很容易就错过的角落。他像一个专业导游那样，带我们走遍了每一处不能错过的地方——要不是他，这座内容极丰富的圣剑寺，可能就被我们囫囵吞枣地略过了。</p>

  <figure>
    <img src="assets/preah-khan/03.jpg" alt="修士壁面">
    <figcaption>一整面墙的婆罗门修士，各自坐在龛里</figcaption>
  </figure>

  <figure>
    <img src="assets/preah-khan/04.jpg" alt="警卫指导拍照">
    <figcaption>大叔倾情动作指导。左侧门楣上有一张卡拉脸</figcaption>
  </figure>

  <figure>
    <img src="assets/preah-khan/05.jpg" alt="渐远的门洞">
    <figcaption>主轴线上的门一重套一重，从内向外一重比一重高大。警卫告诉我们，这个方向是给帝王通行的，所以门越来越大</figcaption>
  </figure>

  <figure>
    <img src="assets/preah-khan/06.jpg" alt="苔痕中的合十者">
    <figcaption>苔痕里的合十者</figcaption>
  </figure>

  <figure>
    <img src="assets/preah-khan/07.jpg" alt="门柱上的女神与门神">
    <figcaption>门柱两面：一面女神，一面门神</figcaption>
  </figure>

  <figure>
    <img src="assets/preah-khan/08.jpg" alt="门楣舞女">
    <figcaption>门楣上的一排舞女，舞姿各不相同</figcaption>
  </figure>

  <figure>
    <img src="assets/preah-khan/09.jpg" alt="两层楼">
    <figcaption>「两层楼」：吴哥遗迹中独一无二的一栋，圆石柱配三角山墙，让人想起希腊神殿。用途至今没有定论，可能是谷仓，也可能是看台</figcaption>
  </figure>

  <figure>
    <img src="assets/preah-khan/10.jpg" alt="抹茶色水面">
    <figcaption>寺外一汪抹茶色的水</figcaption>
  </figure>

  <figure>
    <img src="assets/preah-khan/11.jpg" alt="毗湿奴卧像">
    <figcaption>一方门楣：毗湿奴躺在那伽蛇身上，拉克希米坐在他脚边</figcaption>
  </figure>

  <figure>
    <img src="assets/preah-khan/12.jpg" alt="女神像特写">
    <figcaption>柱间的女神，璎珞还历历可数</figcaption>
  </figure>

  <figure>
    <img src="assets/preah-khan/13.jpg" alt="西塔门与无头门神">
    <figcaption>出寺那一侧的门，两位门神的头都已不见。这是另一个方位的另一组门，同样从内圈向外拍——这一组就是越来越小</figcaption>
  </figure>
