  <div class="work-head">
    <h1>ToT</h1>
    <div class="meta">曼谷 · 唐人街 Soi Nana · 金酒吧</div>
  </div>

  <p>在唐人街逛着逛着想喝一杯，查到附近有家曾经进过 Asia's 50 Best 的店，就导航过去了。门口是一扇藏式木门，雕花的，立在贴满贴纸的墙中间，很别致。大隐隐于市。</p>

  <figure>
    <img src="assets/tot-door.jpg" alt="藏式木门">
  </figure>

  <p>店里是金酒吧，金酒摆满了整面架子。光线暗，音乐放得松，坐下没什么压力。</p>

  <figure>
    <img src="assets/tot-backbar.jpg" alt="金酒墙">
  </figure>

  <p>去得早，点了杯 signature 的菊花金汤力，坐在吧台和调酒师聊了一会儿。是个泰国女生，挺热情。酒比较淡，无功无过，确实没什么可写的。</p>

  <figure>
    <img src="assets/tot-cocktail.jpg" alt="菊花金汤力">
  </figure>

  <p>作为一天 bar tour 的头一家，还不错。</p>
</main>
