    <h1>萤 HOTARU</h1>
    <div class="meta">北京 · 亮马桥 · 日式酒吧</div>
  </div>

  <p>约好了人一起去，到的时候没位子，先在店入口的小座位上等了很久。店很小，等位的地方更小。</p>

  <p>先喝的纯饮，接着点了几款店里的鸡尾酒，都没有特别惊艳。最好喝的是一杯抹茶的，名字已经忘了。</p>

  <figure>
    <img src="assets/hotaru-matcha.jpg" alt="抹茶鸡尾酒">
  </figure>

  <p>店里满墙的酒，氛围不错，来打卡的人不少。</p>

  <figure>
    <img src="assets/hotaru-backbar.jpg" alt="酒墙">
  </figure>

  <p>山竹酒是招牌，没喝。酒整体一般。</p>
